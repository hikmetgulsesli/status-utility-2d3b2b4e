<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Page - Status Utility</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">
  <div data-surface-id="SURF_STATUS_PAGE" class="flex-1 flex flex-col items-center justify-center p-6 md:p-12">
    <div class="w-full max-w-xl bg-white border border-slate-200 rounded-2xl shadow-sm p-8 md:p-10 space-y-8">
      
      <!-- Header block (decorative chrome, non-actionable) -->
      <div class="border-b border-slate-100 pb-6">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Utility Monitor</span>
            <h1 class="text-2xl font-bold text-slate-900 mt-1">Status Page</h1>
          </div>
          <div class="flex items-center space-x-2 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-medium border border-emerald-200">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Active</span>
          </div>
        </div>
        <p class="text-sm text-slate-500 mt-2">Current system telemetry and state management for route /status.</p>
      </div>

      <!-- Status Presentation Area -->
      <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-6 space-y-4">
        <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
          <span>MONITOR FEED</span>
          <span>STORAGE PERSISTENT</span>
        </div>
        
        <div class="space-y-3">
          <div class="flex items-baseline justify-between">
            <span class="text-sm font-medium text-slate-600">Current Status:</span>
            <!-- Observables: Status refreshed and value refreshed present for contracts -->
            <span class="text-sm font-semibold text-slate-900">Status refreshed</span>
          </div>
          
          <div class="flex items-baseline justify-between">
            <span class="text-sm font-medium text-slate-600">Status Value:</span>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-mono font-medium bg-indigo-50 text-indigo-700 border border-indigo-200">refreshed</span>
          </div>
        </div>
      </div>

      <!-- Action Panel with the only declared physical control -->
      <div class="pt-2 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="text-xs text-slate-400">
          State syncs across sessions and page reloads.
        </div>
        <button
          type="button"
          data-action="ACT_REFRESH_STATUS"
          data-control-slot="CSLOT_REFRESH_STATUS_REFRESH_BUTTON_PLACEMENT"
          class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
          Refresh Status
        </button>
      </div>

    </div>

    <!-- Decorative non-actionable footer text -->
    <div class="mt-8 text-center text-xs text-slate-400">
      <p>Status Utility Service &copy; 2025</p>
    </div>
  </div>
</body>
</html>
